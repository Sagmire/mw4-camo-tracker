name: Build Windows app

# Every push to main builds an installer you can download from the Actions page (nothing is published).
# Pushing a version tag (e.g. v1.1.0), or running this workflow by hand with "publish" ticked,
# publishes the version in package.json as a GitHub release in this repo, which is where the
# installed app looks for updates. Only publish after checking the build works.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in package.json as an update
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      # A copy of the installer to download from the Actions page, kept for a few days (not when publishing).
      - if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: MW4-Camo-Tracker-Installer
          path: dist/*.exe
          retention-days: 3
      # The release is named after the version in package.json; a tag must match it,
      # or installed apps would see the wrong version.
      - id: version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # Creates the release and tag (or updates them if they already exist) and uploads the
      # installer plus latest.yml, which installed apps read to find updates.
      - if: steps.version.outputs.tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MW4 Camo Tracker ${{ steps.version.outputs.tag }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
