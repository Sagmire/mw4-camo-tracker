name: Build Windows app

# Every push to main builds an installer you can download from the Actions page (nothing is published).
# Pushing a version tag (e.g. v1.1.0) publishes it as a GitHub release in this repo,
# which is where the installed app looks for updates. Only tag after checking the build works.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tag must match package.json, or installed apps would see the wrong version.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1
          fi
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: MW4-Camo-Tracker-Installer
          path: dist/*.exe
          retention-days: 3
